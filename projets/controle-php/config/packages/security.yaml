security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: /livres
            logout:
                path: app_logout
                target: /login

    role_hierarchy:
        ROLE_DOCUMENTALISTE: ROLE_USER

    # Seule la première règle qui correspond à l'URL s'applique : les règles les plus précises viennent en premier.
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: '^/livres/(nouveau|\d+/(modifier|supprimer))', roles: ROLE_DOCUMENTALISTE }
        - { path: ^/livres, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage rapide pour les tests : ne jamais utiliser ces valeurs en production
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
