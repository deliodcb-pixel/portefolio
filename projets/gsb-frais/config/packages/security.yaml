security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # L'administrateur gère les comptes et traite aussi les fiches de frais.
    # L'inverse reste faux : un comptable n'accède pas à la gestion des comptes.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_COMPTABLE]

    providers:
        # Les trois profils vivent dans des tables distinctes mais partagent le
        # même formulaire de connexion : un provider chaîné les interroge l'un
        # après l'autre, le rôle porté par l'entité décide ensuite de ce qui est
        # accessible. L'unicité des identifiants est vérifiée sur les trois
        # tables à la création d'un compte.
        administrateurs:
            entity:
                class: App\Entity\Administrateur
                property: login
        comptables:
            entity:
                class: App\Entity\Comptable
                property: login
        visiteurs:
            entity:
                class: App\Entity\Visiteur
                property: login
        app_users:
            chain:
                providers: ['administrateurs', 'comptables', 'visiteurs']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_accueil
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # La gestion des comptes reste le seul domaine réservé.
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/comptable, roles: ROLE_COMPTABLE }
        - { path: ^/visiteur, roles: ROLE_VISITEUR }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
